name: Artillery-Fargate-AWS-CodeBuild

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to check out"
        type: string
        required: true
        default: 'main'
      artillery_yml:
        description: "Artillery YML file"
        type: string
        required: true
        default: '<filename.yml>'
      testName:
        description: "Uniuque Test Name"
        type: string
        required: true
        default: 'playwright-load-test-1'
      #serviceName:
        #description: "Service Name to group all the executions for opentelemetry"
        #type: string
        #required: true
        #default: 'playwright-dev-tests'
      #metrics_url:
        #description: "Metrics and Opentelemetry URL"
        #type: string
        #required: true
        #default: ''
      parallel_browsers:
        description: "No. of Parallel Browser instances on AWS Fargate"
        type: number
        required: true
        default: 1
      aggregateByName:
        description: "Group metrics by scenario name rather than by URL"
        type: boolean
        required: true
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  artillery:
    runs-on: codebuild-artillery-performance-38-${{ github.run_id }}-${{ github.run_attempt }}
    
    container: node:20-bookworm-slim
    # Service containers to run with `container-job`
    services:
      redis:
        # Docker Hub image
        image: public.ecr.aws/docker/library/redis:latest
        ports:
          - 6379:6379
          
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # The branch, tag or SHA to checkout. When checking out the repository that
          # triggered a workflow, this defaults to the reference or SHA for that event.
          # Otherwise, uses the default branch.
          ref: '${{ inputs.branch }}'
          
      - name: Push Data To Redis
        run: node client.js

      - name: Run Fargate Test
        timeout-minutes: 60 # best practice: adding timeout in case something goes wrong with the test, so that GitHub Action won’t run for the default 6h
        run: |
          redis-server -v
          redis-cli -v
          run run-fargate --region us-east-1 --count ${{ inputs.parallel_browsers }} --cpu 1024 --memory 2048 --output ${{ inputs.testName }}-results.json --cluster artillery-custom-img ./${{ inputs.artillery_yml }} --subnet-ids subnet-0c0943d209d628cff,subnet-0fea648d64c3c28d6,subnet-081814582892bfb0a --variables '{ "aggregate_by_name": "${{ inputs.aggregateByName }}" }' --dotenv .env
          # run run-fargate --region us-east-1 --count ${{ inputs.parallel_browsers }} --cpu 1024 --memory 2048 --output "${{ inputs.testName }}"-results.json --cluster artillery-opentelemetry-metrics --variables '{ "test_name": "${{ inputs.testName }}", "service_name": "${{ inputs.serviceName }}", "metrics_url": "${{ inputs.metrics_url }}" }' ./${{ inputs.artillery_yml }} --record --key ${{ secrets.ARTILLERY_RESULTS_KEY }}
          # --record --key ${{ secrets.ARTILLERY_RESULTS_KEY }}
          aws s3api create-bucket --bucket artilleryio-results 
          aws s3 cp "${{ inputs.testName }}"-results.json s3://artilleryio-results/"${{ inputs.testName }}"-results.json
          run report "${{ inputs.testName }}"-results.json
          aws s3 cp "${{ inputs.testName }}"-results.json.html s3://artilleryio-results/"${{ inputs.testName }}"-results.html
